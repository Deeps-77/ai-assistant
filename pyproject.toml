[project]
name = "ai-delivery"
version = "0.1.0"
description = "DevSwarm – AI-driven multi-agent software delivery platform (M0 CLI)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langchain>=0.3.0",
    "langchain-core>=0.3.0",
    "langchain-ollama>=0.3.0",
    "langgraph>=0.5.0",
    "python-dotenv>=1.0.0",
    "rich>=13.7.0",
    "pydantic>=2.7.0",
    "httpx>=0.27.0",
    "textual>=8.0.0",
]

[project.scripts]
devswarm = "devswarm.ui.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/devswarm"]
