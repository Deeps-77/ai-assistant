[project]
name = "ai-assistant"
version = "0.1.0"
description = "Multi-agent AI software delivery assistant"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.138.0",
    "langchain>=0.2.0",
    "langchain-ollama>=0.1.0",
    "langchain-openai>=1.3.2",
    "langgraph>=0.2.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.2.2",
    "pyyaml>=6.0",
    "pytest>=8.0.0",
    "deepagents>=0.6.12",
    "aiosqlite>=0.22.1",
    "uvicorn>=0.51.0",
    "chromadb>=0.5.0",
]

[project.scripts]
compile-reqs = "scripts.compile_reqs:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
